<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR 图片体验</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #kivicubeScene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-size: 14px;
      text-align: center;
      padding: 0 24px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="loading">正在加载 AR 场景...</div>

  <!-- ⚠️ 把 scene-id 换成你自己的场景 ID -->
  <iframe
    id="kivicubeScene"
    scene-id="pN45X82F0y5792X4I4N2CO8342J59XOp"
    allow="camera; gyroscope; accelerometer; fullscreen; autoplay"
    allowfullscreen
  ></iframe>

  <script src="https://www.kivicube.com/lib/iframe-plugin.js"></script>

  <script>
    const iframeEl = document.getElementById('kivicubeScene');
    const loading = document.getElementById('loading');

    // ⚠️ 必须是完整的 HTTPS 绝对地址
    const DYNAMIC_IMAGE_URL = 'https://duxttyiyi.github.io/arkivi/tex/tex1.jpg';

    let api = null;

    // 统一隐藏加载层的函数（加一个 flag 防止重复执行）
    let loadingHidden = false;
    function hideLoading() {
      if (loadingHidden) return;
      loadingHidden = true;
      loading.style.display = 'none';
    }

    // ready：拿到 api（场景基础信息就绪）
    iframeEl.addEventListener('ready', (event) => {
      api = event.detail.api;
      console.log('API 就绪');
    });

    // ⚠️【关键修改】在场景加载结束时隐藏加载层，而不是 sceneStart
    iframeEl.addEventListener('loadSceneEnd', () => {
      console.log('场景加载完成，隐藏加载层');
      hideLoading();
    });

    // 兜底：万一某些场景类型没触发 loadSceneEnd，
    // 也在 downloadAssetEnd（素材下载完成）时放开加载层
    iframeEl.addEventListener('downloadAssetEnd', () => {
      console.log('素材下载完成');
      hideLoading();
    });

    // sceneStart：场景正式开始（图像AR/云识别场景下，这是"扫描到识别图"之后）
    // 此时加载层早已隐藏，这里只做内容相关的操作
    iframeEl.addEventListener('sceneStart', async () => {
      hideLoading(); // 再兜底一次
      if (!api) return;

      try {
        const image = await api.createImage(DYNAMIC_IMAGE_URL);
        await api.add(image);
        await api.setPosition(image, 0, 1.2, 0);
        await api.setScale(image, 1.5, 1.5, 1.5);
        console.log('动态图片已导入');
      } catch (e) {
        console.error('导入图片失败:', e);
      }
    });

    // error：捕获加载/权限错误
    iframeEl.addEventListener('error', (event) => {
      const detail = event.detail;
      console.error('Plugin error:', detail);
      loadingHidden = false;
      loading.style.display = 'flex';
      loading.textContent = '加载失败：' + ((detail && detail.message) || '未知错误');
    });

    // incompatibility：兼容性兜底
    iframeEl.addEventListener('incompatibility', (event) => {
      const detail = event.detail || {};
      console.warn('兼容性检测失败:', detail);
      loadingHidden = false;
      loading.style.display = 'flex';
      loading.textContent = detail.needMobile
        ? '请在手机端浏览器中打开本页面体验 AR。'
        : '当前浏览器不支持 AR 体验，请更换浏览器或设备。';
    });
  </script>
</body>
</html>
