<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR 图片体验</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    /* iframe 铺满全屏 */
    #kivicubeScene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }
    /* 加载提示层 */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- 加载提示（sceneStart 后隐藏） -->
  <div id="loading">正在加载 AR 场景...</div>

  <!-- AR 场景 iframe，用 scene-id（Web Plugin 方式） -->
  <iframe
    id="kivicubeScene"
    scene-id="pN45X82F0y5792X4I4N2CO8342J59XOp"
    allow="camera; gyroscope; accelerometer; fullscreen; autoplay"
    allowfullscreen
  ></iframe>

  <!-- 引入 Kivicube iframe 插件脚本（放在 body 末尾） -->
  <script src="https://www.kivicube.com/lib/iframe-plugin.js"></script>

  <script>
    const iframeEl = document.getElementById('kivicubeScene');
    const loading = document.getElementById('loading');

    // 动态导入的图片地址（换成你实际的 HTTPS 图片 URL）
    const DYNAMIC_IMAGE_URL = 'tex/tex1.jpg';

    let api = null;

    // ready：拿到 api（场景基础信息就绪）
    iframeEl.addEventListener('ready', (event) => {
      api = event.detail.api;
      console.log('API 就绪');
    });

    // sceneStart：场景已开始，此时隐藏加载层并动态导入图片
    iframeEl.addEventListener('sceneStart', async () => {
      loading.style.display = 'none';
      if (!api) return;

      try {
        // 动态导入一张 2D 图片作为显示内容（替代 3D 摆件）
        const image = await api.createImage(DYNAMIC_IMAGE_URL);
        await api.add(image);
        // 摆放在识别图上方，并设置缩放
        await api.setPosition(image, 0, 1.2, 0);
        await api.setScale(image, 1.5, 1.5, 1.5);
        console.log('动态图片已导入');
      } catch (e) {
        console.error('导入图片失败:', e);
      }
    });

    // error：捕获加载/权限错误（便于排查）
    iframeEl.addEventListener('error', (event) => {
      const detail = event.detail;
      console.error('Plugin error:', detail);
      loading.textContent = '加载失败：' + ((detail && detail.message) || '未知错误');
    });
  </script>
</body>
</html>
